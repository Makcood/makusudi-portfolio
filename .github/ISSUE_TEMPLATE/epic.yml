name: Epic
description: A larger body of work, broken down into sub-issues
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Describe why this work matters and what will be true once it is complete. Once created, add each piece of work as a sub-issue of this epic.

  - type: textarea
    id: value-proposition
    attributes:
      label: VALUE PROPOSITION
      description: Why this epic matters to the user, in one or two sentences.
      value: "> "
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: EXPECTED OUTCOME
      description: What will be true once every sub-issue is complete.
      value: |
        > - [ ] 
        > - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: NOTES
      description: |
        Optional. Add an alert only if the content needs one: `[!NOTE]`, `[!TIP]`, `[!IMPORTANT]`, `[!WARNING]` or `[!CAUTION]`.
      placeholder: |
        > [!NOTE]
        > The sub-issues are stacked and must be completed in order.
